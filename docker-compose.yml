# AI-Ops Docker Compose 配置
# 集成 Claude Agent SDK 架构

services:
  # Go Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-pro:latest
    container_name: ai-pro-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
      - ./scripts:/app/scripts:ro
    environment:
      - TZ=Asia/Shanghai
      - SERVER_ADDR=:8080
      - SERVER_MODE=release
      - DATABASE_DSN=/app/data/aiops.db
      - AGENT_SERVICE_URL=http://agent-service:3001
    depends_on:
      - agent-service
    networks:
      - ai-pro-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Node.js Agent Service (Claude SDK)
  agent-service:
    build:
      context: ./agent-service
      dockerfile: Dockerfile
    container_name: ai-pro-agent
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - TZ=Asia/Shanghai
      - PORT=3001
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-claude-sonnet-4-20250514}
      - MCP_SERVER_URL=http://mcp-server:3002
      - GO_BACKEND_URL=http://backend:8080
    depends_on:
      - mcp-server
    networks:
      - ai-pro-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # MCP Server (Tools)
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    container_name: ai-pro-mcp
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - TZ=Asia/Shanghai
      - PORT=3002
      - GO_BACKEND_URL=http://backend:8080
    networks:
      - ai-pro-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  ai-pro-network:
    driver: bridge

volumes:
  ai-pro-data:
    driver: local
